      <stop offset="65%" stop-color="#0b1d27" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#07121d" stop-opacity="0.82"/>
    </radialGradient>
    <pattern id="bpGrid" width="20" height="20" patternUnits="userSpaceOnUse">

      <path d="M 90 148 Q 98 138 104 148 Q 110 158 118 148" fill="none" stroke-width="2.4"/>
      <path d="M 154 148 Q 162 138 168 148 Q 174 158 182 148" fill="none" stroke-width="2.4"/>
    </g>
    <text x="72" y="153" fill="#7ce2ff" font-family="'Consolas',monospace" font-size="12" font-weight="bold" text-anchor="middle">Pγ</text>
    <text x="136" y="153" fill="#7ce2ff" font-family="'Consolas',monospace" font-size="12" font-weight="bold" text-anchor="middle">Pβ</text>
    <text x="200" y="153" fill="#7ce2ff" font-family="'Consolas',monospace" font-size="12" font-weight="bold" text-anchor="middle">Pα</text>
    <!-- Link to 5-Carbon Pentose Ring -->
    <line x1="218" y1="148" x2="254" y2="176" stroke="#e5c16c" stroke-width="2.2"/>
    <polygon points="254,176 286,154 318,176 306,214 266,214" fill="#10203a" stroke="url(#goldStroke)" stroke-width="2.2"/>
    <text x="286" y="160" fill="#f7e4ad" font-family="'Consolas',monospace" font-size="9.5" font-weight="bold" text-anchor="middle">O</text>
    <text x="286" y="232" fill="#f4e6be" font-family="'Consolas',monospace" font-size="8.2" text-anchor="middle">5-C SUGAR RING</text>

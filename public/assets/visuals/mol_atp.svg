  <!-- Main Blueprint Geometry -->
  <g>
    <!-- Three Linked Phosphate Groups (Highlighted in Luminous Cyan) -->
    <g stroke="#4cc9f0" filter="url(#glowCyan)">
      <circle cx="72" cy="148" r="18" fill="#0d2542" stroke-width="2.0"/>
      <circle cx="136" cy="148" r="18" fill="#0d2542" stroke-width="2.0"/>

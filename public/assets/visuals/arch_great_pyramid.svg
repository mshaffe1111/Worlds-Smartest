  <!-- Corner Registration Reticles -->
  <path d="M 14 28 L 14 14 L 28 14 M 452 14 L 466 14 L 466 28 M 14 272 L 14 286 L 28 286 M 452 286 L 466 286 L 466 272" fill="none" stroke="#e5c16c" stroke-width="1.8"/>
  <!-- Main Blueprint Geometry -->
  <g>
    <!-- Ground Horizon -->
    <line x1="36" y1="232" x2="444" y2="232" stroke="#e5c16c" stroke-width="1.4"/>
    <!-- Outer Pyramid Triangle (51.8 deg slope, base 310px, height 196px -> ~51.7 deg) -->
    <polygon points="85,232 240,36 395,232" fill="#0d1b32" stroke="#e5c16c" stroke-width="2.1" filter="url(#glowGold)"/>
    <!-- Masonry Course Hairlines -->
    <line x1="116" y1="193" x2="364" y2="193" stroke="#e5c16c" stroke-opacity="0.16" stroke-width="0.7"/>
    <line x1="147" y1="154" x2="333" y2="154" stroke="#e5c16c" stroke-opacity="0.16" stroke-width="0.7"/>
    <line x1="178" y1="115" x2="302" y2="115" stroke="#e5c16c" stroke-opacity="0.16" stroke-width="0.7"/>
    <!-- Internal Passages & Chambers (Glowing Sapphire Cyan) -->
    <g stroke="#4cc9f0" fill="none" filter="url(#glowCyan)">
      <!-- Entrance & Descending Passage to Subterranean Chamber -->
      <polyline points="116,192 224,254 252,254" stroke-width="2.0"/>
      <rect x="252" y="246" width="24" height="14" fill="#091a30" stroke-width="1.6"/>
      <!-- Ascending Passage + Horizontal Passage to Queen Chamber -->
      <polyline points="154,214 206,184 246,184" stroke-width="2.0"/>
      <rect x="246" y="176" width="18" height="13" fill="#091a30" stroke-width="1.6"/>
      <!-- Corbelled Grand Gallery rising to King Chamber -->
      <polyline points="206,184 252,150 264,150" stroke-width="3.6"/>
      <!-- Upper Burial Chamber with Relieving Beams -->
      <rect x="264" y="138" width="26" height="16" fill="#091a30" stroke-width="1.8"/>
      <line x1="264" y1="133" x2="290" y2="133" stroke-width="1.0"/>
      <line x1="264" y1="129" x2="290" y2="129" stroke-width="1.0"/>
      <!-- Dual Astronomical Air Shafts -->
      <line x1="266" y1="142" x2="176" y2="116" stroke-width="1.0" stroke-dasharray="3 2"/>
      <line x1="288" y1="142" x2="334" y2="114" stroke-width="1.0" stroke-dasharray="3 2"/>
    </g>
    <!-- Slope Angle Arc -->
    <path d="M 118 232 A 33 33 0 0 0 105 206" fill="none" stroke="#f4e6be" stroke-width="1.2"/>
    <text x="122" y="224" fill="#f4e6be" font-family="'Consolas',monospace" font-size="8.5" font-weight="bold">51.8°</text>
    <text x="64" y="54" fill="#f4e6be" font-family="'Consolas',monospace" font-size="8.6" font-weight="bold">H: 146.6 M</text>
    <text x="64" y="66" fill="#7ce2ff" font-family="'Consolas',monospace" font-size="8.4">BASE: 230.4 M</text>
    <text x="416" y="54" fill="#7ce2ff" font-family="'Consolas',monospace" font-size="8.5" text-anchor="end">3 CHAMBERS</text>
    <text x="416" y="66" fill="#f4e6be" font-family="'Consolas',monospace" font-size="8.4" text-anchor="end">c. 2560 BCE</text>

      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e4ad"/>
      <stop offset="50%" stop-color="#e5c16c"/>
      <stop offset="100%" stop-color="#b68a35"/>

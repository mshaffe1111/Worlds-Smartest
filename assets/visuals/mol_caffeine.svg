    <!-- 6-Membered Ring (N1, C2, N3, C4, C5, C6) -->
    <polygon points="154,116 206,86 258,116 258,176 206,206 154,176" fill="#0d1e36" stroke="url(#goldStroke)" stroke-width="2.4"/>
